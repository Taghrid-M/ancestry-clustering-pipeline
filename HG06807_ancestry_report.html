<div id="tt"></div>
<script>
const CTX={"disp": {"43": "C43 \u00b7 AFR-like", "6": "C6 \u00b7 AFR-like", "18": "C18 \u00b7 AFR-like", "22": "C22 \u00b7 AFR-like", "12": "C12 \u00b7 AFR-like", "23": "C23 \u00b7 WAS-like", "0": "C0 \u00b7 SAS-like", "47": "C47 \u00b7 AFR-like", "2": "C2 \u00b7 AMR-like", "7": "C7 \u00b7 AMR-like", "9": "C9 \u00b7 AFR-like", "45": "C45 \u00b7 AMR-like", "39": "C39 \u00b7 WAS-like", "21": "C21 \u00b7 AMR-like", "27": "C27 \u00b7 AMR-like", "8": "C8 \u00b7 AFR-like", "36": "C36 \u00b7 SAS-like", "34": "C34 \u00b7 AMR-like", "25": "C25 \u00b7 EUR-like", "10": "C10 \u00b7 AFR-like", "40": "C40 \u00b7 EUR-like", "19": "C19 \u00b7 EUR-like", "28": "C28 \u00b7 AMR-like", "5": "C5 \u00b7 EUR-like", "3": "C3 \u00b7 EAS-like", "15": "C15 \u00b7 EAS-like", "37": "C37 \u00b7 SAS-like", "35": "C35 \u00b7 SAS-like", "11": "C11 \u00b7 SAS-like", "13": "C13 \u00b7 SAS-like", "20": "C20 \u00b7 EUR-like", "4": "C4 \u00b7 OCE-like", "42": "C42 \u00b7 EUR-like", "44": "C44 \u00b7 EAS-like", "24": "C24 \u00b7 EAS-like", "1": "C1 \u00b7 EAS-like", "38": "C38 \u00b7 EUR-like", "14": "C14 \u00b7 EAS-like", "33": "C33 \u00b7 AFR-like", "41": "C41 \u00b7 EAS-like", "32": "C32 \u00b7 EAS-like", "26": "C26 \u00b7 EUR-like", "31": "C31 \u00b7 EUR-like", "29": "C29 \u00b7 EAS-like", "16": "C16 \u00b7 SAS-like", "46": "C46 \u00b7 EAS-like", "30": "C30 \u00b7 EAS-like", "17": "C17 \u00b7 EAS-like"}, "color": {"43": "#e43f19", "6": "#72444f", "18": "#b93a36", "22": "#c73a2e", "12": "#ab3c3f", "23": "#724f44", "0": "#724465", "47": "#f2430c", "2": "#446772", "7": "#457288", "9": "#8f444e", "45": "#0c4cf2", "39": "#f2b10c", "21": "#41789d", "27": "#3a78b2", "8": "#804550", "36": "#dd1f5c", "34": "#1f63dd", "25": "#7d40a2", "10": "#9d4148", "40": "#c61ae2", "19": "#644582", "28": "#2e71c7", "5": "#594472", "3": "#517e45", "15": "#4d9543", "37": "#f20c43", "35": "#c72e6b", "11": "#88456f", "13": "#9d4174", "20": "#6f4392", "4": "#a56231", "42": "#df0cf2", "44": "#17e63b", "24": "#41ac3c", "1": "#507244", "38": "#b027d2", "14": "#508944", "33": "#d53c24", "41": "#20db39", "32": "#29cf38", "26": "#8b3ab2", "31": "#9c31c2", "29": "#37b837", "16": "#b23a73", "46": "#0cf23e", "30": "#30c337", "17": "#48a140"}}, PCA3D={};
const tt=document.getElementById('tt');
function moveTT(e){ tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY+14)+'px'; }
function showTT(html,e){ tt.innerHTML=html; tt.style.display='block'; moveTT(e); }
function hideTT(){ tt.style.display='none'; }
document.addEventListener('mousemove',e=>{ if(tt.style.display==='block') moveTT(e); });

(function(){
  const chip=document.getElementById('chip'), chiptxt=document.getElementById('chiptxt'), sw=chip.querySelector('.sw');
  const all=Array.from(document.querySelectorAll('[data-c]'));
  let locked=null;
  const label=c=>(CTX.disp[c]||('C'+c));
  window.__toggleLock=function(c){ (locked===c)?clearLock():setLock(c); };
  function setLock(c){
    locked=c; document.body.classList.add('locked');
    all.forEach(el=>el.classList.toggle('hot', el.dataset.c===c));
    sw.style.background=CTX.color[c]||'#888'; chiptxt.textContent=label(c); chip.style.display='inline-flex';
    if(window.__pca3dSetLock) window.__pca3dSetLock(c);
  }
  function clearLock(){
    locked=null; document.body.classList.remove('locked');
    all.forEach(el=>el.classList.remove('hot')); chip.style.display='none';
    if(window.__pca3dSetLock) window.__pca3dSetLock(null);
  }
  all.forEach(el=>{
    el.addEventListener('mouseenter',e=>showTT('<b>'+label(el.dataset.c)+'</b>'+(el.dataset.info?'<br>'+el.dataset.info:''),e));
    el.addEventListener('mouseleave',hideTT);
    el.addEventListener('click',ev=>{ ev.stopPropagation(); window.__toggleLock(el.dataset.c); });
  });
  document.getElementById('reset').addEventListener('click',clearLock);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') clearLock(); });
})();

(function(){
  if(!PCA3D||!PCA3D.p||!PCA3D.p.length) return;
  const cv=document.getElementById('pca3d'); if(!cv) return;
  const g=cv.getContext('2d'), P=PCA3D.p, C=PCA3D.c, S=PCA3D.s, COL=CTX.color, DISP=CTX.disp;
  let n=P.length,cx=0,cy=0,cz=0; for(const q of P){cx+=q[0];cy+=q[1];cz+=q[2];} cx/=n;cy/=n;cz/=n;
  let ex=[1e9,-1e9],ey=[1e9,-1e9],ez=[1e9,-1e9];
  for(const q of P){ex[0]=Math.min(ex[0],q[0]);ex[1]=Math.max(ex[1],q[0]);
    ey[0]=Math.min(ey[0],q[1]);ey[1]=Math.max(ey[1],q[1]);ez[0]=Math.min(ez[0],q[2]);ez[1]=Math.max(ez[1],q[2]);}
  const rng=Math.max(ex[1]-ex[0],ey[1]-ey[0],ez[1]-ez[0])||1, sc=1/rng;
  const NP=P.map(q=>[(q[0]-cx)*sc,(q[1]-cy)*sc,(q[2]-cz)*sc]);
  const DPR=Math.max(1, cv.width/(cv.clientWidth||cv.width));
  let yaw=0.7,pitch=0.35,zoom=1,drag=false,lx=0,ly=0,lock=null,proj=[];
  function R(){ return Math.min(cv.width,cv.height)*0.42*zoom; }
  function proj3(x,y,z){ const cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),r=R();
    const X=x*cyw+z*syw, Z=-x*syw+z*cyw, Y2=y*cp-Z*sp, Z2=y*sp+Z*cp;
    return [cv.width/2+X*r, cv.height/2-Y2*r, Z2]; }
  function draw(){
    proj=NP.map(q=>proj3(q[0],q[1],q[2]));
    g.clearRect(0,0,cv.width,cv.height);
    g.strokeStyle='#c8ccd2'; g.lineWidth=1.2*DPR; g.font=(12*DPR)+'px sans-serif'; g.fillStyle='#8a929c'; g.textBaseline='middle';
    const L=['PC1','PC2','PC3'];
    for(let a=0;a<3;a++){ const v0=[0,0,0],v1=[0,0,0]; v0[a]=-0.6; v1[a]=0.6;
      const p0=proj3(v0[0],v0[1],v0[2]), p1=proj3(v1[0],v1[1],v1[2]);
      g.beginPath();g.moveTo(p0[0],p0[1]);g.lineTo(p1[0],p1[1]);g.stroke();
      g.fillText(L[a],p1[0]+4*DPR,p1[1]); }
    const order=[...proj.keys()].sort((i,j)=>proj[i][2]-proj[j][2]);
    for(const i of order){ const c=C[i];
      g.globalAlpha = lock? (c===lock?1:0.06):0.9;
      g.beginPath(); g.arc(proj[i][0],proj[i][1],(3.0+(proj[i][2]+0.6)*1.2)*DPR,0,6.2832);
      g.fillStyle=COL[c]||'#888'; g.fill();
      if(lock&&c===lock){ g.lineWidth=0.8*DPR; g.strokeStyle='#111'; g.stroke(); } }
    g.globalAlpha=1;
  }
  function pick(cxp,cyp){ const rect=cv.getBoundingClientRect();
    const px=(cxp-rect.left)*(cv.width/rect.width), py=(cyp-rect.top)*(cv.height/rect.height);
    let best=-1,bd=(11*DPR)*(11*DPR);
    for(let i=0;i<proj.length;i++){const dx=proj[i][0]-px,dy=proj[i][1]-py,d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;}}
    return best; }
  cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('mouseup',()=>drag=false);
  window.addEventListener('mousemove',e=>{ if(!drag) return;
    yaw+=(e.clientX-lx)*0.01; pitch+=(e.clientY-ly)*0.01; pitch=Math.max(-1.5,Math.min(1.5,pitch));
    lx=e.clientX;ly=e.clientY; draw(); });
  cv.addEventListener('mousemove',e=>{ if(drag) return; const i=pick(e.clientX,e.clientY);
    if(i>=0){ showTT('<b>'+(DISP[C[i]]||('C'+C[i]))+'</b><br>'+S[i],e);} else hideTT(); });
  cv.addEventListener('mouseleave',hideTT);
  cv.addEventListener('wheel',e=>{e.preventDefault(); zoom*=Math.exp(-e.deltaY*0.001); zoom=Math.max(0.4,Math.min(4,zoom)); draw();},{passive:false});
  cv.addEventListener('click',e=>{ const i=pick(e.clientX,e.clientY); if(i>=0) window.__toggleLock(C[i]); });
  window.__pca3dSetLock=function(c){ lock=c; draw(); };
  draw();
})();
</script>
